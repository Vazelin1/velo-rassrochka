<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/calc.js"></script>
<style>:root{--bg:#F5F2EC;--c:#fff;--tx:#2E2E2B;--mu:#8A877F;--ac:#6F8F86;--ac2:#E4ECE8;--ok:#9DBFA6;--wa:#E8C27A;--er:#D98B7E;--ln:#E6E0D5}
@media(prefers-color-scheme:dark){:root{--bg:#1F1E1C;--c:#2A2927;--tx:#EFEBE4;--mu:#9C978D;--ac:#8FB3A8;--ac2:#33403B;--ln:#3A3834}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:92px}
h2{font-size:28px;font-weight:600;margin:0;letter-spacing:-.5px}h2 small{font-size:15px;font-weight:400;color:var(--mu)}h3{font-size:21px;font-weight:600;margin:4px 0 14px}
.p{padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 18px 10px}.mu{color:var(--mu);font-size:14px}
.card{background:var(--c);margin:10px 16px;padding:15px 16px;border-radius:20px;box-shadow:0 2px 12px rgba(70,60,40,.07);border-left:5px solid var(--ok)}.card.y{border-color:var(--wa)}.card.r{border-color:var(--er)}
.chip{float:right;padding:3px 11px;border-radius:20px;font-size:12px;background:var(--ac2);color:var(--ac)}.y .chip{background:#F6E8C8;color:#7a5a12}.r .chip{background:#F5D6D0;color:#8a2f22}
button{padding:12px 20px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 15px -apple-system,sans-serif;margin:4px 6px 0 0}button.g{background:var(--ac2);color:var(--ac)}button.x{background:var(--er)}button.s{padding:9px 14px;font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 2px 2px}input,select,textarea{width:100%;padding:13px 14px;margin:4px 0;font:16px -apple-system,sans-serif;border:1px solid var(--ln);border-radius:14px;background:var(--c);color:var(--tx)}
.tabs{padding:6px 16px 0}.tabs button{background:none;color:var(--mu);padding:8px 14px}.tabs button.on{background:var(--ac2);color:var(--ac)}
.th{position:relative;display:inline-block;margin:6px 8px 0 0}.th img{width:76px;height:76px;object-fit:cover;border-radius:14px}.th i{position:absolute;top:-6px;right:-6px;background:var(--er);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;line-height:22px}
.pv{background:var(--ac2);border-radius:18px;padding:14px;margin:14px 0}.bar{height:6px;background:var(--ln);border-radius:4px;margin:10px 0}.bar i{display:block;height:6px;background:var(--ac);border-radius:4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding:6px 4px 14px}nav button{flex:1;margin:0;background:none;color:var(--mu);font-size:11px;font-weight:500;padding:6px 0;border-radius:0}nav button b{display:block;font-size:22px;font-weight:400}nav button.pl b{background:var(--ac);color:#fff;width:46px;height:46px;border-radius:50%;margin:-20px auto 2px;line-height:46px;box-shadow:0 4px 12px rgba(70,90,80,.3)}</style></head><body>
<div id="app"></div><nav><button onclick="nav('home')"><b>⌂</b>Главная</button><button onclick="nav('base')"><b>▤</b>База</button><button class="pl" onclick="nav('add')"><b>+</b>Добавить</button><button onclick="nav('rep')"><b>◷</b>Отчёты</button><button onclick="nav('set')"><b>⚙</b>Настройки</button></nav>
<script>
const T=Telegram.WebApp;T.ready();T.expand();
let S={clients:[],bikes:[],deals:[],cfg:{}},V=[['home']],tab='clients',ph=[];
const $=s=>document.querySelector(s),v=s=>$(s).value,m=n=>Math.round(n).toLocaleString('ru')+' ₽',fmt=d=>d.split('-').reverse().join('.');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>(S.clients.find(c=>c.id==id)||{}).name||'?',bk=id=>(S.bikes.find(c=>c.id==id)||{}).name||'?';
const api=async(p,b)=>{const r=await fetch(p,{method:b?'POST':'GET',headers:{'X-Init':T.initData,'Content-Type':'application/json'},body:b&&JSON.stringify(b)});if(!r.ok)throw 0;return r.json()};
async function load(){try{const a=await api('/api/all');S={clients:[],bikes:[],deals:[],cfg:{}};a.forEach(d=>{if(d.kind=='cfg')S.cfg=d.data;else S[d.kind+'s'].push({...d.data,id:d.id})});render()}catch(e){$('#app').innerHTML='<p class=p>Доступ запрещён или нет связи. Откройте приложение из Telegram-бота.</p>'}}
async function put(kind,o){o.id=o.id||Math.random().toString(36).slice(2,10);await api('/api/put',{kind,id:o.id,data:o});await load()}
const nav=s=>{V=[[s]];render()},go=(s,a)=>{V.push([s,a]);render()},back=()=>{if(V.length>1)V.pop();render()};
function render(){const[s,a]=V[V.length-1];if(s=='fBike')ph=[...((S.bikes.find(x=>x.id==a)||{}).photos||[])];$('#app').innerHTML=({home,base,add,fClient,fBike,fDeal,deal,calcS,rep,set})[s](a);if(s=='fDeal'){termOpts();updD()}if(s=='calcS')updC();scrollTo(0,0)}
const chip=n=>n<0?`просрочка ${-n} дн.`:n==0?'платёж сегодня':`через ${n} дн.`;
const dsTxt=()=>(S.cfg.ds||[[30000,2],[50000,4]]).map(x=>x[0].toLocaleString('ru')+' → '+x[1]).join(', ');
function home(){const act=S.deals.filter(d=>d.status=='active'),t=C.today();
const rows=act.map(d=>({d,x:C.sched(d).find(x=>!d.paid[x.k])})).filter(r=>r.x).sort((a,b)=>a.x.due<b.x.due?-1:1).slice(0,10);
return `<div class=top><h2>${act.length}<small> под выкупом</small></h2><button class=s onclick="go('calcS')">Калькулятор</button></div>`+rows.map(({d,x})=>{const n=C.diff(x.due,t);return `<div class="card ${n<=0?'r':n<=2?'y':''}" onclick="go('deal','${d.id}')"><span class=chip>${chip(n)}</span><b>${esc(nm(d.client))}</b><div class=mu>оплачено до ${fmt(x.due)} · ${m(x.amt)}</div></div>`}).join('')||'<p class="p mu">Ближайших платежей нет</p>'}
function base(){const l=tab=='clients'?S.clients.map(c=>`<div class=card onclick="go('fClient','${c.id}')"><b>${esc(c.name)}</b><div class=mu>${esc(c.phone||'')} ${esc(c.tg||'')}</div></div>`):tab=='bikes'?S.bikes.map(b=>`<div class=card onclick="go('fBike','${b.id}')"><b>${esc(b.name)}</b><div class=mu>${esc(b.vin||'')} · закупка ${m(b.cost)}</div></div>`):S.deals.filter(d=>d.status!='active').map(d=>`<div class=card onclick="go('deal','${d.id}')"><span class=chip>${{archived:'выкуплен',seized:'изъят'}[d.status]}</span><b>${esc(nm(d.client))}</b><div class=mu>${esc(bk(d.bike))}</div></div>`);
return `<div class=top><h2>База</h2></div><div class=tabs>${[['clients','Клиенты'],['bikes','Велосипеды'],['arch','Архив']].map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}</div>`+(l.join('')||'<p class="p mu">Пока пусто</p>')}
const add=()=>`<div class=top><h2>Добавить</h2></div><div class=p><button onclick="go('fClient')">Клиента</button><button onclick="go('fBike')">Велосипед</button><button onclick="go('fDeal')">Выкуп</button></div>`;
function fClient(id){const c=S.clients.find(x=>x.id==id)||{};return `<div class=p><h3>Клиент</h3><label>ФИО</label><input id=n value="${esc(c.name)}"><label>Основной телефон</label><input id=p1 type=tel value="${esc(c.phone)}"><label>Telegram (@ник, по желанию)</label><input id=tg value="${esc(c.tg)}"><label>Другие телефоны (по одному на строке: номер и подпись, например «мама»)</label><textarea id=ph rows=3>${esc(c.phones)}</textarea><label>Комментарий</label><input id=cm value="${esc(c.comment)}"><button onclick="saveC('${c.id||''}')">Сохранить</button><button class=g onclick=back()>Отмена</button></div>`}
async function saveC(id){if(!v('#n').trim()||!v('#p1').trim())return alert('Введите ФИО и основной телефон');await put('client',{id:id||undefined,name:v('#n').trim(),phone:v('#p1').trim(),tg:v('#tg').trim(),phones:v('#ph'),comment:v('#cm')});nav('base')}
const img=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)});
const thumbs=()=>ph.map((s,i)=>`<span class=th><img src="${s}"><i onclick="ph.splice(${i},1);$('#th').innerHTML=thumbs()">✕</i></span>`).join('');
async function addPh(el){for(const f of [...el.files].slice(0,4-ph.length))ph.push(await img(f));el.value='';$('#th').innerHTML=thumbs()}
function fBike(id){const b=S.bikes.find(x=>x.id==id)||{};return `<div class=p><h3>Велосипед</h3><label>Название</label><input id=n value="${esc(b.name)}"><label>VIN</label><input id=vin value="${esc(b.vin)}"><label>Стоимость закупки, ₽</label><input id=co type=number value="${esc(b.cost)}"><label>SIM-карта трекера</label><input id=sim value="${esc(b.sim)}"><label>Комментарий</label><textarea id=cm rows=3>${esc(b.comment)}</textarea><label>Фото (до 4, удаляются навсегда при переводе в архив выкупленных)</label><input type=file accept="image/*" multiple onchange="addPh(this)"><div id=th>${thumbs()}</div><br><button onclick="saveB('${b.id||''}')">Сохранить</button><button class=g onclick=back()>Отмена</button></div>`}
async function saveB(id){if(!v('#n').trim()||!(+v('#co')>0))return alert('Введите название и закупку');await put('bike',{id:id||undefined,name:v('#n').trim(),vin:v('#vin'),cost:+v('#co'),sim:v('#sim'),comment:v('#cm'),photos:ph});tab='bikes';nav('base')}
function fDeal(){return `<div class=p><h3>Новый выкуп</h3><label>Клиент</label><select id=c>${S.clients.map(c=>`<option value=${c.id}>${esc(c.name)}`).join('')}</select><label>Велосипед</label><select id=b onchange=updD()>${S.bikes.filter(b=>!S.deals.some(d=>d.bike==b.id&&d.status=='active')).map(b=>`<option value=${b.id}>${esc(b.name)}`).join('')}</select><label>Оплата</label><select id=t onchange="termOpts();updD()"><option value=w>Еженедельно (7 дней)<option value=m>Ежемесячно (30 дней)</select><label>Срок</label><select id=n onchange=updD()></select><label>Первоначальный взнос, ₽</label><input id=dn type=number oninput=updD()><label>Скидка, п.п. (пусто = авто: ${dsTxt()})</label><input id=ds type=number oninput=updD()><label>Номер договора</label><input id=ct><label>Дата оформления (первый день)</label><input id=s type=date value="${C.today()}"><label>Второй аккумулятор: закупка, ₽ (если берёт)</label><input id=ec type=number oninput=updD()><label>Способ оплаты первого периода</label><select id=m><option>наличные<option>СБП<option>перевод</select><div id=pv class=pv></div><button onclick=saveDeal()>Создать выкуп</button><button class=g onclick=back()>Отмена</button></div>`}
function termOpts(){const t=v('#t'),mk=S.cfg.mk||C.MK;$('#n').innerHTML=Object.keys(mk[t]).map(n=>`<option value=${n}>${n} ${t=='w'?'нед.':'мес.'} (+${mk[t][n]}%)`).join('')}
function dealIn(){const b=S.bikes.find(x=>x.id==v('#b'));if(!b||!v('#c'))return;const ec=+v('#ec');return{cost:b.cost,type:v('#t'),n:+v('#n'),down:+v('#dn')||0,disc:v('#ds'),mk:S.cfg.mk,tax:S.cfg.tax,ds:S.cfg.ds,extras:ec?[{name:'Второй аккумулятор',cost:ec,price:Math.round(ec*(1+(S.cfg.exm==null?24:S.cfg.exm)/100))}]:[]}}
const res=r=>`Цена ${m(r.total)} · остаток ${m(r.bal)}<br>Платёж <b>${m(r.pay)}</b> · последний ${m(r.last)}<br><span class=mu>Налог ${S.cfg.tax==null?7:S.cfg.tax}%: ${m(r.tax)} · прибыль ${m(r.profit)} (${r.pct.toFixed(0)}%)</span>${r.pct<25?'<br><b style=color:var(--er)>⚠ прибыль ниже 25%</b>':''}`;
function updD(){const o=dealIn();$('#pv').innerHTML=o?res(C.calc(o)):'Сначала добавьте клиента и велосипед'}
async function saveDeal(){const o=dealIn();if(!o)return alert('Нужны клиент и велосипед');const r=C.calc(o);
await put('deal',{client:v('#c'),bike:v('#b'),type:o.type,n:o.n,start:v('#s'),down:o.down,disc:r.d,mk:r.mk,cost:o.cost,pay:r.pay,last:r.last,total:r.total,tax:r.tax,extras:o.extras,contract:v('#ct'),pen:S.cfg.pen==null?0.9:S.cfg.pen,status:'active',paid:{1:{date:v('#s'),amt:o.n==1?r.last:r.pay,pen:0,method:v('#m')}}});nav('home')}
function deal(id){const d=S.deals.find(x=>x.id==id),t=C.today(),sc=C.sched(d),all=sc.every(x=>d.paid[x.k]),c=S.clients.find(x=>x.id==d.client)||{},k=sc.filter(x=>d.paid[x.k]).length;
return `<div class=p><button class="g s" onclick=back()>← Назад</button><h3 style="margin-top:14px">${esc(nm(d.client))}</h3><div class=mu>${esc(bk(d.bike))} · договор ${esc(d.contract||'—')} от ${fmt(d.start)}<br>${esc(c.phone)} ${esc(c.tg)}${c.phones?'<br>'+esc(c.phones).replace(/\n/g,'<br>'):''}</div><div class=bar><i style="width:${k/sc.length*100}%"></i></div>Оплачено ${k} из ${sc.length} · цена ${m(d.total)} · налог ${m(d.tax)}${d.status!='active'?'<br><b>'+({archived:'Выкуплен (архив)',seized:'Изъят'}[d.status])+'</b>':''}</div>`+sc.map(x=>{const p=d.paid[x.k];return `<div class="card ${p?'':x.due<t?'r':''}"><b>${x.k}. ${fmt(x.due)}</b> · ${m(x.amt)}<div class=mu>${p?`✓ ${fmt(p.date)}, ${p.method}${p.pen?', неустойка '+m(p.pen):''}`:(x.due<t?'просрочка':'ожидается')}</div>${!p&&d.status=='active'?`<button class=s onclick="pay('${d.id}',${x.k})">Оплачен</button>`:''}</div>`}).join('')+(d.status=='active'?`<div class=p>${all?`<button onclick="fin('${d.id}','archived')">В архив выкупленных</button>`:''}<button class=x onclick="fin('${d.id}','seized')">Изъять</button></div>`:'')}
async function pay(id,k){const d=S.deals.find(x=>x.id==id),x=C.sched(d)[k-1],dt=prompt('Дата получения (ГГГГ-ММ-ДД)',C.today());if(!dt)return;const mt=prompt('Способ: 1 наличные, 2 СБП, 3 перевод','1');if(!mt)return;
const pen=C.penalty(x.amt,Math.max(0,C.diff(dt,x.due)),d.pen);if(!confirm(`Принято ${m(x.amt+pen)} (неустойка ${m(pen)})?`))return;d.paid[k]={date:dt,amt:x.amt,pen,method:['','наличные','СБП','перевод'][mt]||'наличные'};await put('deal',d)}
async function fin(id,st){const d=S.deals.find(x=>x.id==id);if(st=='seized'){if(!confirm('Изъять велосипед? Выкуп будет закрыт.'))return;d.refund=+prompt('Возвращено клиенту, ₽','0')||0}
else{if(!confirm('Перевести в архив выкупленных? Фото велосипеда будут удалены безвозвратно.'))return;const b=S.bikes.find(x=>x.id==d.bike);if(b&&(b.photos||[]).length){b.photos=[];await put('bike',b)}}
d.status=st;await put('deal',d);nav('home')}
const calcS=()=>`<div class=p><button class="g s" onclick=back()>← Назад</button><h3 style="margin-top:14px">Калькулятор</h3><label>Закупка велосипеда, ₽</label><input id=k type=number oninput=updC()><label>Оплата</label><select id=t2 onchange=updC()><option value=w>Недели<option value=m>Месяцы</select><label>Первоначальный взнос, ₽</label><input id=d2 type=number oninput=updC()></div><div id=tb></div>`;
function updC(){const cost=+v('#k'),t=v('#t2'),mk=S.cfg.mk||C.MK;$('#tb').innerHTML=!cost?'':Object.keys(mk[t]).map(n=>{const r=C.calc({cost,type:t,n:+n,down:+v('#d2')||0,mk:S.cfg.mk,tax:S.cfg.tax,ds:S.cfg.ds});return `<div class="card ${r.pct<25?'r':''}"><b>${n} ${t=='w'?'нед.':'мес.'}</b> · платёж ${m(r.pay)}<div class=mu>последний ${m(r.last)} · цена ${m(r.total)} · налог ${m(r.tax)}<br>прибыль ${m(r.profit)} (${r.pct.toFixed(0)}%)${r.pct<25?' ⚠':''}</div></div>`}).join('')}
const rep=()=>'<div class=top><h2>Отчёты</h2></div><p class="p mu">Отчёты и аналитика появятся в следующей части.</p>';
function set(){const mk=S.cfg.mk||C.MK,ds=S.cfg.ds||[[30000,2],[50000,4]],tx=S.cfg.tax==null?7:S.cfg.tax,pn=S.cfg.pen==null?0.9:S.cfg.pen;return `<div class=top><h2>Настройки</h2></div><div class=p><h3>Наценки, %</h3>${['w','m'].map(t=>Object.keys(mk[t]).map(n=>`<label>${n} ${t=='w'?'недель':'месяцев'}</label><input type=number data-t=${t} data-n=${n} value=${mk[t][n]}>`).join('')).join('')}<h3 style="margin-top:22px">Дополнительный аккумулятор</h3><label>Наценка на закупку, %</label><input id=exm type=number value=${S.cfg.exm==null?24:S.cfg.exm}><h3 style="margin-top:22px">Налог и неустойка</h3><label>Налог с выручки, %</label><input id=tax type=number step=any value=${tx}><label>Неустойка, % от платежа за каждый день просрочки</label><input id=pen type=number step=any value=${pn}><h3 style="margin-top:22px">Скидка за первоначальный взнос</h3><label>Взнос 1, ₽</label><input id=da0 type=number value=${ds[0][0]}><label>Скидка 1, п.п. к наценке</label><input id=db0 type=number step=any value=${ds[0][1]}><label>Взнос 2, ₽</label><input id=da1 type=number value=${ds[1][0]}><label>Скидка 2, п.п. к наценке</label><input id=db1 type=number step=any value=${ds[1][1]}><p class=mu>Новые значения действуют для новых выкупов, в уже созданных налог и неустойка остаются прежними.</p><button onclick=saveSet()>Сохранить</button></div>`}
async function saveSet(){const mk={w:{},m:{}};document.querySelectorAll('[data-t]').forEach(i=>mk[i.dataset.t][i.dataset.n]=+i.value);await put('cfg',{id:'cfg',mk,exm:+v('#exm'),tax:+v('#tax'),pen:+v('#pen'),ds:[[+v('#da0'),+v('#db0')],[+v('#da1'),+v('#db1')]]});alert('Сохранено')}
load();
</script></body></html>
