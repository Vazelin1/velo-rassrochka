<script>
const T=(window.Telegram&&Telegram.WebApp)||{};
try{T.ready();T.expand()}catch(e){}
const $=s=>document.querySelector(s),v=s=>$(s).value,m=n=>Math.round(n).toLocaleString('ru')+'\u00A0₽',fmt=d=>d.split('-').reverse().join('.');

const tx2=t=>esc(t).replace(/\n/g,'<br>');
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const hap=k=>{try{k?T.HapticFeedback.notificationOccurred(k):T.HapticFeedback.impactOccurred('light')}catch(e){}};
const ABORT={abort:1};
/* ---------- theme: follows Telegram */
function setTheme(){const d=T.colorScheme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=d;
try{const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();T.setHeaderColor&&T.setHeaderColor(bg);T.setBackgroundColor&&T.setBackgroundColor(bg)}catch(e){}}
setTheme();try{T.onEvent('themeChanged',setTheme)}catch(e){}
/* ---------- dates */
const WD=['вс','пн','вт','ср','чт','пт','сб'],WF=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'],MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay(),dnum=d=>+d.slice(8,10);
const dlong=d=>`${WF[dow(d)]}, ${dnum(d)} ${MG[+d.slice(5,7)-1]}`,dshort=d=>`${dnum(d)} ${MG[+d.slice(5,7)-1]}`;
const dayWord=n=>{const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?'дней':b==1?'день':b>1&&b<5?'дня':'дней'};
/* ---------- sheets (windows that slide up) and toast */
function sheet(html,wire,cancel){return new Promise(res=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class=sh role=dialog aria-modal=true><div class=grab></div>${html}</div>`;document.body.appendChild(o);requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('on')));

const uiAlert=(t,title)=>sheet(`${title?`<h3>${esc(title)}</h3>`:''}<p>${tx2(t)}</p><button class="btn blk" data-y>Понятно</button>`,(o,d)=>o.querySelector('[data-y]').onclick=()=>d(),undefined);
const uiConfirm=(t,yes,o={})=>sheet(`${o.title?`<h3>${esc(o.title)}</h3>`:''}<p>${tx2(t)}</p><button class="btn blk ${o.danger?'dng':''}" data-y>${esc(yes||'Да')}</button><button class="btn sec blk" data-n>Отмена</button>`,(el,d)=>{el.querySelector('[data-y]').onclick=()=>d(true);el.querySelector('[data-n]').onclick=()=>d(false)},false);
const uiPrompt=(t,v0)=>sheet(`<p>${tx2(t)}</p><input type=number inputmode=numeric value="${esc(v0)}"><button class="btn blk" data-y>Готово</button><button class="btn sec blk" data-n>Отмена</button>`,(o,d)=>{o.querySelector('[data-y]').onclick=()=>d(o.querySelector('input').value);o.querySelector('[data-n]').onclick=()=>d(null)},null);
const uiPick=(t,L)=>sheet(`<h3>${esc(t)}</h3>${L.map((x,i)=>`<button class=opt data-i=${i}>${esc(x)}</button>`).join('')}<button class="btn sec blk" data-n>Отмена</button>`,(o,d)=>{o.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>d(L[+b.dataset.i]));o.querySelector('[data-n]').onclick=()=>d(null)},null);
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- api */
const api=async(p,b)=>{const r=await fetch(p,{method:b?'POST':'GET',headers:{'X-Init':T.initData||'','Content-Type':'application/json'},body:b&&JSON.stringify(b)});if(!r.ok){let e;try{e=(await r.json()).err}catch(x){}throw e||'код '+r.status}return r.json()};
window.onerror=(msg,u,l)=>{uiAlert('Ошибка: '+msg+' (строка '+l+')')};
window.addEventListener('unhandledrejection',e=>{const r=e.reason;e.preventDefault();if(r===ABORT)return;uiAlert('Ошибка: '+((r&&r.message)||r))});
/* ---------- state and roles */
let S={clients:[],bikes:[],deals:[],admins:[],cfg:{}},V=[['home']],ME,tab='clients',qs='',allSch=false,ph=[],lastLoad=0;
const isOwner=()=>ME&&ME.role=='owner',can=p=>isOwner()||!!(ME&&(ME.perms||[]).includes(p)),canFin=()=>isOwner()||!!(ME&&ME.fin);
async function load(quiet){const a=await api('/api/all');S={clients:[],bikes:[],deals:[],admins:[],cfg:{}};a.forEach(d=>{if(d.kind=='cfg')S.cfg=d.data;else S[d.kind+'s'].push({...d.data,id:d.id})});lastLoad=Date.now();if(!quiet)render(true)}
async function put(kind,o){if(!o.id){o.id=Math.random().toString(36).slice(2,10);o.created=new Date().toISOString()}
try{await api('/api/put',{kind,id:o.id,data:o})}catch(e){if(e=='conflict'){await load();await uiAlert('Эти данные только что изменились (другой администратор или вход). Экран обновлён, повторите действие.');throw ABORT}
if(e=='код 403'){await uiAlert('У вас нет прав на это действие.');throw ABORT}throw e}
await load()}
/* ---------- navigation */
let navDir='';
const stale=()=>{if(Date.now()-lastLoad>20000&&typeof soft=='function')soft()};
const nav=s=>{V=[[s]];allSch=false;if(s!='base'){qs=''}navDir='';render();stale()},go=(s,a)=>{V.push([s,a]);allSch=false;navDir='fw';render();stale()},back=()=>{if(V.length>1){V.pop();navDir='bw'}render()};
const newest=(a,b)=>(b.created||'')<(a.created||'')?-1:1;
function chrome(){try{const n=ME&&ME.role=='client'?CV.length:V.length;n>1?T.BackButton.show():T.BackButton.hide()}catch(e){}}
try{T.BackButton.onClick(()=>{if(document.querySelector('.ov'))return;ME&&ME.role=='client'?cback():back()})}catch(e){}
function navUI(){const R=V[0][0],it=[['home','home','Главная'],['base','base','База']];
if(can('clients')||can('deals')||can('bikes'))it.push(['add','plus','Добавить']);if(can('reports'))it.push(['rep','chart','Отчёты']);if(isOwner())it.push(['set','sliders','Настройки']);
$('#navbar').innerHTML=it.map(([k,i,n])=>`<button class="tb ${k=='add'?'add':''} ${R==k?'on':''}" onclick="hap();nav('${k}')" aria-label="${n}"><span class=pill>${ic(i)}</span>${n}</button>`).join('')}
function render(keep){const[s,a]=V[V.length-1];if(s=='fBike')ph=[...((S.bikes.find(x=>x.id==a)||{}).photos||[])];
const el=$('#app');el.innerHTML=SCR[s](a);el.className='';if(navDir){void el.offsetWidth;el.className=navDir}navDir='';
if(s=='fDeal'){termOpts();updD()}if(s=='calcS')updC();if(s=='payS')updPay();if(s=='debtS')updDebt();if(s=='swapS')updSw();if(s=='logS')loadLog();if(!keep)scrollTo(0,0);navUI();chrome()}
document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)&&e.target.type!='checkbox')$('#nav').classList.add('hid')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName))$('#nav').classList.remove('hid')},50));
/* ---------- small components */
const nm=id=>(S.clients.find(c=>c.id==id)||{}).name||'?',bk=id=>(S.bikes.find(c=>c.id==id)||{}).name||'?';
const ini=n=>(String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();

function center(i,h,t){$('#app').innerHTML=`<div class=center>${ic(i,'l')}<h1>${esc(h)}</h1><p>${tx2(t)}</p></div>`}
const seg=(id,L,sel,cls)=>`<div class="seg ${cls||''}" id=${id}>${L.map((x,i)=>`<button type=button class="${(sel==null?i==0:x==sel)?'on':''}" onclick="segSel(this)">${esc(x)}</button>`).join('')}</div>`;
function segSel(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');hap();const i=b.parentNode.id;if(i=='pt')updPay();else if(i=='dp')updDebt()}
const segVal=id=>($(id+' .on')||{}).textContent;
/* the wheel: one segment per payment of the schedule */
function wheel(st,o={}){const N=st.length,Z=o.size||44,w=o.sw||4,r=(Z-w)/2,c=Z/2,sa=2*Math.PI*r/N,cap=o.round?w:0,gp=N>1?Math.min((o.gap||1.8)+cap,sa-.3):0,g=gp/r*180/Math.PI,
pt=a=>{const t=a*Math.PI/180;return[(c+r*Math.cos(t)).toFixed(2),(c+r*Math.sin(t)).toFixed(2)]};let h='';
if(N<2)h=`<circle class="${st[0]||'u'}" cx=${c} cy=${c} r=${r} style="--i:0"/>`;
else st.forEach((s,i)=>{const a0=-90+360/N*i+g/2,a1=-90+360/N*(i+1)-g/2,[x0,y0]=pt(a0),[x1,y1]=pt(a1);h+=`<path class="${s}" style="--i:${i}" d="M${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}"/>`});
return `<svg class="wh ${o.round?'rd':''} ${o.an?'an':''}" width=${Z} height=${Z} viewBox="0 0 ${Z} ${Z}" style="--w:${w}px" aria-hidden=true>${h}</svg>`}
const whw=(st,o,inner,cls)=>`<div class=whw style="width:${o.size}px;height:${o.size}px">${wheel(st,o)}<div class="in ${cls||''}">${inner}</div></div>`;

/* ---------- deals: schedule, status, colours */
const act=()=>S.deals.filter(d=>d.status=='active'),dealOf=(k,id)=>act().find(d=>d[k]==id);
/* days (late) are calendar days after the due date; penalty days (days) take a write-off (d.pw) and the «no penalty» periods (d.np) into account. g: debt left after a partial payment, with its own penalty. */
function info(d){const sc=C.sched(d),t=C.today(),un=sc.filter(x=>!d.paid[x.k]),od=un.filter(y=>y.due<t),ods=od.map(y=>{const n=C.pdays(y.due,t,d);return{...y,days:n,late:C.diff(t,y.due),pen:C.penalty(y.amt,n,d.pen)}}),pen=ods.reduce((a,y)=>a+y.pen,0),g=C.dstat(d,t);return{sc,un,x:un[0],od,ods,pen,g,owe:od.reduce((a,y)=>a+y.amt,0)+pen,done:!un.length&&!g}}
const DM=()=>S.cfg.dmin==null?50:S.cfg.dmin,DB=()=>S.cfg.dbd==null?3:S.cfg.dbd,minPart=x=>Math.ceil(x.amt*DM()/100);
const plur=(n,a,b,c)=>{const x=Math.abs(n)%100,y=x%10;return x>10&&x<20?c:y==1?a:y>1&&y<5?b:c};
/* what is owed now: overdue payments plus the penalty accrued today; a tap on the amount shows the parts */
const dealById=id=>((ME&&ME.role=='client'?ME.deals:S.deals)||[]).find(x=>x.id==id);
const oweSub=I=>`${I.ods.length>1?`${I.ods.length} ${plur(I.ods.length,'платёж','платежа','платежей')}`:m(I.x.amt)}${I.pen?` + неустойка ${m(I.pen)}`:''}`;
function oweSheet(id){const d=dealById(id);if(!d)return;const I=info(d);if(!I.od.length)return;const r=String(d.pen==null?0.9:d.pen).replace('.',',');
sheet(`<h3>К оплате сейчас</h3><div class=pv style="margin:6px 0 4px">${I.ods.map(o=>kv(`Платёж, период ${o.k} (до ${fs(o.due)})`,m(o.amt))+(o.pen?kv(`Неустойка за ${o.days} ${dayWord(o.days)} просрочки`,m(o.pen)):'')).join('')}<div class=kv style="font-size:17px"><span style="color:var(--ink);font-weight:650">Итого</span><b>${m(I.owe)}</b></div></div>${I.pen?`<p style="margin:12px 0 0;font-size:14px">Неустойка начисляется за каждый день просрочки: ${r}% от суммы платежа в день. Сумма указана на сегодня, завтра она будет больше.</p>`:''}<button class="btn blk" data-y>Понятно</button>`,(o,x)=>o.querySelector('[data-y]').onclick=()=>x())}
const fs=d=>fmt(d).slice(0,5);
const per=(d,x)=>x.k==1?`${fs(d.start)} – ${fs(C.add(d.start,6))}`:`${fs(C.add(x.due,1))} – ${fs(C.add(x.due,7))}`;
const cls=d=>{if(!d)return'n';const I=info(d);return I.od.length||(I.g&&I.g.over)?'er':I.g?'wa':I.done?'ok':'bl'};
const tag=d=>!d?'':{er:'просрочка',wa:'долг',ok:'выплачен',bl:'в выкупе'}[cls(d)];
function states(d){const t=C.today(),I=info(d),g=I.g;let first=true;return I.sc.map(x=>g&&x.k==g.k?(g.over?'o':'x'):d.paid[x.k]?'p':x.due<t?'o':first?(first=false,C.diff(x.due,t)<=2?'x':'n'):'u')}
const mini=(d,name)=>whw(states(d),{size:48,sw:4.5},esc(ini(name)),'ini');
const dealRow=(a,chipH,sub,amt)=>`<button class=row onclick="go('deal','${a.d.id}')">${mini(a.d,nm(a.d.client))}<span class=tx><b>${esc(nm(a.d.client))}</b><span>${sub}</span></span><span class=rt>${amt?`<b>${amt}</b>`:''}${chipH}</span></button>`;
const backBtn=()=>`<button class=back onclick=back()>${ic('left')}Назад</button>`;
/* ---------- home */
let HDAYS=[],calOpen=false;
function togCal(){calOpen=!calOpen;const h=$('.hero');if(!h)return;h.classList.toggle('open',calOpen);h.querySelector('.hh').setAttribute('aria-expanded',calOpen);hap()}
function home(){const A=act().map(d=>({d,...info(d)})),t=C.today();
const dbt=A.filter(a=>a.g).sort((a,b)=>a.g.due<b.g.due?-1:1),od=A.filter(a=>a.od.length).sort((a,b)=>a.od[0].due<b.od[0].due?-1:1),ok=A.filter(a=>!a.od.length&&a.x).sort((a,b)=>a.x.due<b.x.due?-1:1).slice(0,10),dn=A.filter(a=>a.done);

/* what the client pays for the first unpaid period on the chosen date: the whole period, or a part of it (not less than dmin %); the penalty for the days already late is always paid in full; the rest of the period becomes a debt */
function payCalc(d){const x=info(d).x,dt=v('#pd')||C.today(),part=!!$('#pt')&&segVal('#pt')=='Часть',n=C.pdays(x.due,dt,d),pen=C.penalty(x.amt,n,d.pen);let pa=x.amt,err='';

return{x,dt,n,pen,part,pa,err,rest:x.amt-pa,tot:pa+pen}}
function updPay(){const el=$('#am');if(!el)return;const[,id]=V[V.length-1],d=S.deals.find(x=>x.id==id),c=payCalc(d);if($('#pbx'))$('#pbx').style.display=c.part?'':'none';
el.textContent=m(c.tot);$('#amd').innerHTML=(c.part?kv('Часть периода',m(c.pa)):c.pen?kv('Платёж',m(c.x.amt)):'')+(c.pen?kv(`Неустойка за ${c.n} ${dayWord(c.n)} просрочки`,m(c.pen)):'')+(c.part?kv('Останется долг',m(c.rest))+kv('Внести без неустойки',`до ${fmt(C.add(c.dt,DB()))}`):'')+(c.err?`<p class=sub style="margin:8px 0 0;color:var(--ert)">${c.err}</p>`:'')}

function debtCalc(d){const dt=v('#dd2')||C.today(),g=C.dstat(d,dt),part=segVal('#dp')=='Часть';let pr=g.amt,err='';

function updDebt(){const el=$('#dam');if(!el)return;const[,id]=V[V.length-1],d=S.deals.find(x=>x.id==id),c=debtCalc(d);if(c.part&&v('#dsum')===''&&document.activeElement!==$('#dsum')){$('#dsum').value=Math.max(c.g.pen+1,Math.round(c.g.total/2));return updDebt()}if($('#dbx'))$('#dbx').style.display=c.part?'':'none';

let w='Изменено';
if(k=='deal'){const po=Object.keys(o.paid||{}).length,pn=Object.keys(n.paid||{}).length;const nk=Object.keys(n.paid||{}).find(q=>!(o.paid||{})[q]);w=pn>po?(nk&&n.paid[nk].part?'Принята частичная оплата':'Принята оплата'):pn<po?'Отменена оплата':(n.dpays||[]).length>(o.dpays||[]).length?'Принята оплата долга':(n.dpays||[]).length<(o.dpays||[]).length?'Отменена оплата долга':n.pw&&n.pw!=o.pw?'Списана неустойка':C.nopen(n)!=C.nopen(o)?(C.nopen(n)?'Неустойка не начисляется':'Неустойка снова начисляется'):(n.early||[]).length>(o.early||[]).length?'Досрочный платёж':(n.shift||0)>(o.shift||0)?'Отсрочка':n.status!=o.status?{archived:'Выкуп завершён',seized:'Велосипед изъят',lost:'Списание велосипеда',active:'Выкуп снова открыт'}[n.status]||'Статус изменён':n.bike!=o.bike?'Замена велосипеда':'Изменён выкуп'}
else if(k=='bike')w=n.wo&&!o.wo?'Списан':!n.wo&&o.wo?'Возвращён в парк':n.archived&&!o.archived?'В архив':(n.exp||[]).length>(o.exp||[]).length?'Добавлен расход':(n.exp||[]).length<(o.exp||[]).length?'Удалён расход':'Изменён';
else if(k=='client')w=n.archived&&!o.archived?'В архив':'Изменён';else if(k=='cfg')w='Изменены настройки';else if(k=='admin')w=n.disabled!=o.disabled?(n.disabled?'Доступ отключён':'Доступ включён'):'Изменены права';
return w+(k=='cfg'?'':': '+lab)}
function logRow([ts,act,id,o,n]){const[a,p]=act.split('@'),who=a=='defer-client'?'Клиент':p||'Владелец',t=new Date(ts);
return `<div class="row nl" style="cursor:default;min-height:64px"><span class=tx><b style="font-size:16px;white-space:normal">${esc(logWhat(a,id,o,n))}</b><span>${esc(who)}, ${ts.slice(8,10)}.${ts.slice(5,7)} ${ts.slice(11,16)}</span></span></div>`}
const logS=()=>`${backBtn()}<div class=hd><div><small>Последние 250 действий</small><h1>Журнал</h1></div></div><div id=lg><div class=spin style="margin-top:16vh"></div></div>`;
async function loadLog(){try{const L=await api('/api/log');$('#lg').innerHTML=L.length?`<div class=grp>${L.map(logRow).join('')}</div>`:empty('list','Записей пока нет')}catch(e){$('#lg').innerHTML=empty('alert','Не удалось загрузить журнал')}}
/* ---------- invitations */
const invBtns=cid=>`<button class="btn sec" onclick="invite('${cid}')">${ic('link','s')}Ссылка для входа</button><button class="btn sec" onclick="unbind('${cid}')">${ic('lock','s')}Сбросить доступ</button>`;
async function invite(cid){try{const r=await api('/api/invite',{client:cid}),link=`https://t.me/${r.bot}?startapp=${r.tok}`,ad=cid.startsWith('adm:');
sheet(`<h3>${ad?'Ссылка для администратора':'Ссылка для клиента'}</h3><p>Отправьте ссылку ${ad?'администратору':'клиенту'}: он откроет её в Telegram и введёт свой номер телефона. Ссылка действует 7 дней и подходит одному человеку.</p><textarea id=lk rows=3 readonly>${link}</textarea><button class="btn blk" data-c>${ic('copy','s')}Скопировать</button><button class="btn sec blk" data-s>${ic('send','s')}Отправить в Telegram</button><button class="btn sec blk" data-x>Закрыть</button>`,(o,d)=>{
o.querySelector('[data-x]').onclick=()=>d();o.querySelector('[data-s]').onclick=()=>T.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link));
o.querySelector('[data-c]').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Ссылка скопирована')}catch(e){o.querySelector('#lk').select()}}},null)}catch(e){uiAlert('Не удалось создать ссылку. Проверьте BOT_USERNAME в настройках сервера.')}}
async function unbind(cid){if(await uiConfirm('Клиенту понадобится новая ссылка.','Сбросить',{title:'Сбросить доступ клиента?'})){await api('/api/unbind',{client:cid});toast('Доступ сброшен')}}

/* ---------- screens for the owner and administrators */
const SCR={home,base,add,fClient,fBike,fDeal,deal,payS,debtS,calcS,rep,set,expS,woS,swapS,bikeView,fAdmin,logS};
/* ---------- client */
let CV=['main'];
const cgo=s=>{CV.push(s);navDir='fw';crender()},cback=()=>{if(CV.length>1){CV.pop();navDir='bw'}crender()};
const cBack=()=>`<button class=back onclick=cback()>${ic('left')}Назад</button>`;
function defAsk(id){uiConfirm(`Ближайший платёж и все следующие сдвинутся на ${ME.dd} ${dayWord(ME.dd)}, неустойка в эти дни начисляться не будет. Отсрочку можно взять только один раз за весь срок выкупа.`,'Взять отсрочку',{title:`Отсрочка на ${ME.dd} ${dayWord(ME.dd)}`}).then(async y=>{if(!y)return;try{await api('/api/defer',{id});ME=await api('/api/me');hap('success');toast('Отсрочка оформлена');crender()}catch(e){uiAlert('Отсрочка недоступна: возможно, она уже использована или есть просрочка.')}})}
async function claim(tok){try{await api('/api/claim',{tok,phone:v('#ph')});location.reload()}catch(e){uiAlert('Проверьте номер телефона и ссылку. Номер должен совпадать с тем, который вы сообщили владельцу.','Не удалось войти')}}
function clientUI(){$('#nav').style.display='none';
if(ME.role=='new'){const tok=startParam();$('#app').innerHTML=tok?`<div class=center><div style="display:flex;justify-content:center">${wheel(Array.from({length:26},(_,i)=>i<17?'p':i==17?'x':'u'),{size:132,sw:12,round:true,gap:3,an:true})}</div><h1>Вход</h1><p>Введите номер телефона, который вы сообщили владельцу.</p><div style="text-align:left"><input id=ph type=tel inputmode=tel placeholder="+7 900 000-00-00" autocomplete=tel></div><div class=acts style="margin:16px 0 0"><button class="btn blk lg" onclick="claim('${esc(tok)}')">Войти</button></div></div>`:`<div class=center>${ic('link','l')}<h1>Нужна ссылка</h1><p>Откройте ссылку для входа, которую прислал владелец.</p></div>`;return}
lastLoad=Date.now();crender()}
const startParam=()=>{const u=T.initDataUnsafe||{};if(u.start_param)return u.start_param;const x=(location.search+'&'+location.hash.replace(/^#/,'')).match(/tgWebAppStartParam=([^&]+)/);return x?decodeURIComponent(x[1]):''};
function crender(){const d=ME.deals.find(x=>x.status=='active')||ME.deals[0];if(!d){$('#app').innerHTML=`<div class=center>${ic('bike','l')}<h1>Выкупов пока нет</h1><p>Когда владелец оформит выкуп, он появится здесь.</p></div>`;return}
const el=$('#app');el.innerHTML=({main:cmain,sch:csch,hist:chist})[CV[CV.length-1]](d);el.className='';if(navDir){void el.offsetWidth;el.className=navDir}navDir='';scrollTo(0,0);chrome()}
function cmain(d){const I=info(d),t=C.today(),x=I.x,k=I.sc.length-I.un.length,on=d.status=='active';let tn='ok',tx='Период оплачен, всё хорошо',icn='check';
if(!on){tn='n';tx=d.status=='archived'?'Выкуп завершён. Поздравляем!':'Выкуп закрыт';icn='flag'}
else if(I.done)tx='Всё оплачено. Поздравляем!';
else{const n=x?C.diff(x.due,t):1,g=I.g;if(n<0){tn='dr';tx=`Просрочка ${-n} ${dayWord(-n)}${I.pen?`. Неустойка ${m(I.pen)}`:''}`;icn='alert'}else if(g&&g.over){tn='dr';tx=`Долг просрочен на ${g.late} ${dayWord(g.late)}${g.pen?`. Неустойка ${m(g.pen)}`:''}`;icn='alert'}else if(g){tn='wa';tx=`Остаток ${m(g.amt)} нужно внести до ${fmt(g.due)}`;icn='clock'}else if(n==0){tn='er';tx='Сегодня день оплаты';icn='alert'}else if(n<=2){tn='wa';tx=n==1?'Завтра оплата':'Оплата через 2 дня';icn='clock'}}
const can2=on&&!I.done&&!(d.defer||[]).some(z=>z.by=='client')&&!I.od.length&&!(I.g&&I.g.over);
return `<div class="hd"><div><small>${esc(d.bike||'Электровелосипед')}</small><h1>Мой выкуп</h1></div></div><div class="cb t-${tn}"><span class=gl>${ic(icn)}</span><span>${esc(tx)}</span></div>
<div class=cw>${whw(states(d),{size:236,sw:20,round:true,gap:4,an:true},`<span class=k>${k}</span><small>из ${I.sc.length} платежей</small>`)}</div>
${x&&on?(I.od.length?`<button class="cn owe" onclick="oweSheet('${d.id}')"><div class=mu>К оплате сейчас</div><div class=big>${m(I.owe)}</div><div style="font-size:18px;font-weight:650;margin-top:2px">${oweSub(I)}</div><div class=hint>Что входит в сумму${ic('right','s')}</div></button>`:`<div class=cn><div class=mu>Следующий платёж</div><div class=big>${m(x.amt)}</div><div style="font-size:18px;font-weight:650;margin-top:2px">до ${fmt(x.due)}</div><div class=mu style="margin-top:4px">Период ${x.k} из ${I.sc.length}: ${per(d,x)}</div></div>`):''}
${I.g&&on?`<div class=cn><div class=mu>${I.g.over?'Долг просрочен':`Остаток периода ${I.g.k}`}</div><div class=big${I.g.over?' style="color:var(--ert)"':''}>${m(I.g.total)}</div><div style="font-size:18px;font-weight:650;margin-top:2px">${I.g.pen?`${m(I.g.amt)} + неустойка ${m(I.g.pen)}`:`до ${fmt(I.g.due)}`}</div><div class=mu style="margin-top:4px">${I.g.over?`Срок без неустойки был до ${fmt(I.g.due)}`:`Без неустойки можно внести до ${fmt(I.g.due)}`}</div></div>`:''}
<div class=cp><button class=tl onclick="cgo('sch')"><span class=gl>${ic('cal')}</span><span>График платежей</span>${ic('right')}</button><button class=tl onclick="cgo('hist')"><span class=gl>${ic('clock')}</span><span>История оплат</span>${ic('right')}</button>${can2?`<button class=tl onclick="defAsk('${d.id}')"><span class=gl>${ic('bolt')}</span><span>Отсрочка на ${ME.dd} ${dayWord(ME.dd)}</span>${ic('right')}</button>`:''}</div>`}
const csch=d=>{const I=info(d),O=Object.fromEntries(I.ods.map(o=>[o.k,o]));return `${cBack()}<div class=hd><h1>График платежей</h1></div><div class=grp>`+I.sc.map(x=>{const p=d.paid[x.k],o=O[x.k];return `<div class="per ${p?'ok':o?'er':''}"><span class=dot>${p?ic('check','s'):x.k}</span><span class=tx><b>${per(d,x)}</b><span>${p?(p.part?'внесено '+m(p.amt)+' из '+m(x.amt)+', ':'оплачен ')+fmt(p.date)+(p.pen?`, неустойка ${m(p.pen)}`:''):'до '+fmt(x.due)+(o&&o.pen?`, неустойка ${m(o.pen)}`:'')}</span></span><b>${m(p?p.amt+(p.pen||0):x.amt+(o?o.pen:0))}</b></div>`}).join('')+'</div>'};
const chist=d=>{const L=Object.entries(d.paid).map(([k,p])=>({date:p.date,a:m(p.amt+(p.pen||0)),s:`период ${k}${p.part?' (часть)':''}, ${esc(p.method)}${p.pen?`, неустойка ${m(p.pen)}`:''}`})).concat((d.dpays||[]).map(z=>({date:z.date,a:m(z.amt+(z.pen||0)),s:`долг по периоду ${z.k}, ${esc(z.method)}${z.pen?`, неустойка ${m(z.pen)}`:''}`}))).concat((d.early||[]).map(e=>({date:e.date,a:m(e.paid||e.amt),s:`досрочный платёж, ${esc(e.method)}`}))).sort((a,b)=>a.date<b.date?1:-1);
return `${cBack()}<div class=hd><h1>История оплат</h1></div>`+(L.length?`<div class=grp>${L.map(e=>`<div class="row nl" style="cursor:default"><span class=tx><b>${e.a}</b><span>${fmt(e.date)}, ${e.s}</span></span></div>`).join('')}</div>`:empty('clock','Платежей пока нет'))};
/* ---------- start */
async function soft(){try{await load(true);const s=V[V.length-1][0];if((V.length==1&&['home','base','rep'].includes(s))||s=='deal')render(true)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden||!ME)return;
if(ME.role=='owner')refreshMe();
if((ME.role=='owner'||ME.role=='admin')&&Date.now()-lastLoad>30000)soft();
if(ME.role=='client'&&Date.now()-lastLoad>30000)api('/api/me').then(r=>{if(r.role=='client'){ME=r;lastLoad=Date.now();if(CV.length==1)crender()}}).catch(()=>{})});
async function boot(){try{ME=await api('/api/me')}catch(e){return center('lock','Не удалось войти','Откройте приложение из Telegram по ссылке от владельца.\n('+e+')')}
if(ME.role=='owner'||ME.role=='admin'){try{await load(true)}catch(e){return center('lock','Нет связи','Не удалось загрузить данные. Закройте приложение и откройте снова.\n('+e+')')}$('#nav').style.display='';render()}
else if(ME.role=='off')center('lock','Доступ отключён','Обратитесь к владельцу.');
else clientUI()}
boot();

</script></body></html>
