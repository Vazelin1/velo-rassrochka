<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/calc.js"></script>
<style>:root{--bg:#F5F2EC;--c:#fff;--tx:#2E2E2B;--mu:#8A877F;--ac:#6F8F86;--ac2:#E4ECE8;--ok:#7FB28F;--wa:#E8C27A;--er:#D98B7E;--bl:#8FB3D9;--ln:#E6E0D5}
@media(prefers-color-scheme:dark){:root{--bg:#1F1E1C;--c:#2A2927;--tx:#EFEBE4;--mu:#9C978D;--ac:#8FB3A8;--ac2:#33403B;--ln:#3A3834}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:92px}
h2{font-size:28px;font-weight:600;margin:0;letter-spacing:-.5px}h3{font-size:21px;font-weight:600;margin:18px 0 10px}a{color:var(--ac)}
.p{padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 18px 10px}.mu{color:var(--mu);font-size:14px}.sec{margin:20px 18px 2px;font-weight:600}.sec.r{color:#B5594A}
.stats{display:flex;gap:10px;padding:0 16px}.stats div{flex:1;background:var(--c);border-radius:20px;padding:14px;box-shadow:0 2px 12px rgba(70,60,40,.07)}.stats b{display:block;font-size:30px}
.card{background:var(--c);margin:10px 16px;padding:15px 16px;border-radius:20px;box-shadow:0 2px 12px rgba(70,60,40,.07);border-left:6px solid var(--ln)}.card.g{border-color:var(--ok)}.card.y{border-color:var(--wa)}.card.r{border-color:var(--er)}.card.b{border-color:var(--bl)}
.chip{float:right;padding:3px 11px;border-radius:20px;font-size:12px;background:var(--ac2);color:var(--ac)}.y .chip{background:#F6E8C8;color:#7a5a12}.r .chip{background:#F5D6D0;color:#8a2f22}.b .chip{background:#DCE9F6;color:#3b6590}
button,.btn{display:inline-block;padding:12px 20px;border:0;border-radius:14px;background:var(--ac);color:#fff;font:600 15px -apple-system,sans-serif;margin:4px 6px 0 0;text-decoration:none}button.g,.btn.g{background:var(--ac2);color:var(--ac)}button.x{background:var(--er)}button.s{padding:9px 14px;font-size:14px}
button.big{display:block;width:100%;background:var(--ok);font-size:20px;padding:20px;margin:12px 0 6px;border-radius:18px}.big2{font-size:34px;font-weight:700}
label{display:block;font-size:13px;color:var(--mu);margin:12px 2px 2px}input,select,textarea{width:100%;padding:13px 14px;margin:4px 0;font:16px -apple-system,sans-serif;border:1px solid var(--ln);border-radius:14px;background:var(--c);color:var(--tx)}
.tabs{padding:6px 16px 0}.tabs button{background:none;color:var(--mu);padding:8px 14px}.tabs button.on{background:var(--ac2);color:var(--ac)}
.th{position:relative;display:inline-block;margin:6px 8px 0 0}.th img{width:76px;height:76px;object-fit:cover;border-radius:14px}.th i{position:absolute;top:-6px;right:-6px;background:var(--er);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;line-height:22px}
.pv{background:var(--ac2);border-radius:18px;padding:14px;margin:14px 0}.bar{height:10px;background:var(--ln);border-radius:6px;margin:10px 0}.bar i{display:block;height:10px;background:var(--ok);border-radius:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--ln);padding:6px 4px 14px}nav button{flex:1;margin:0;background:none;color:var(--mu);font-size:11px;font-weight:500;padding:6px 0;border-radius:0}nav button b{display:block;font-size:22px;font-weight:400}nav button.pl b{background:var(--ac);color:#fff;width:46px;height:46px;border-radius:50%;margin:-20px auto 2px;line-height:46px;box-shadow:0 4px 12px rgba(70,90,80,.3)}.st{padding:26px 18px;font-size:22px;font-weight:700;color:#fff;text-align:center;background:var(--ok)}.st.y{background:#E0B14A}.st.r{background:var(--er)}.st.dr{background:#B5453A}button.big.g{background:var(--ac2);color:var(--ac)}</style></head><body>
<div id="app"></div><nav><button onclick="nav('home')"><b>⌂</b>Главная</button><button onclick="nav('base')"><b>▤</b>База</button><button class="pl" onclick="nav('add')"><b>+</b>Добавить</button><button onclick="nav('rep')"><b>◷</b>Отчёты</button><button onclick="nav('set')"><b>⚙</b>Настройки</button></nav>
<script>
const T=Telegram.WebApp;T.ready();T.expand();
let S={clients:[],bikes:[],deals:[],cfg:{}},V=[['home']],tab='clients',ph=[],allSch=false;
const $=s=>document.querySelector(s),v=s=>$(s).value,m=n=>Math.round(n).toLocaleString('ru')+' ₽',fmt=d=>d.split('-').reverse().join('.');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>(S.clients.find(c=>c.id==id)||{}).name||'?',bk=id=>(S.bikes.find(c=>c.id==id)||{}).name||'?';
const MT=['','наличные','СБП','перевод'],EA=()=>S.cfg.early||10000;
const api=async(p,b)=>{const r=await fetch(p,{method:b?'POST':'GET',headers:{'X-Init':T.initData,'Content-Type':'application/json'},body:b&&JSON.stringify(b)});if(!r.ok)throw 0;return r.json()};
async function load(){try{const a=await api('/api/all');S={clients:[],bikes:[],deals:[],cfg:{}};a.forEach(d=>{if(d.kind=='cfg')S.cfg=d.data;else S[d.kind+'s'].push({...d.data,id:d.id})});render()}catch(e){$('#app').innerHTML='<p class=p>Доступ запрещён или нет связи. Откройте приложение из Telegram-бота.</p>'}}
async function put(kind,o){if(!o.id){o.id=Math.random().toString(36).slice(2,10);o.created=new Date().toISOString()}await api('/api/put',{kind,id:o.id,data:o});await load()}
const nav=s=>{V=[[s]];allSch=false;render()},go=(s,a)=>{V.push([s,a]);allSch=false;render()},back=()=>{if(V.length>1)V.pop();render()};
const newest=(a,b)=>(b.created||'')<(a.created||'')?-1:1;
function render(){const[s,a]=V[V.length-1];if(s=='fBike')ph=[...((S.bikes.find(x=>x.id==a)||{}).photos||[])];$('#app').innerHTML=({home,base,add,fClient,fBike,fDeal,deal,payS,calcS,rep,set})[s](a);if(s=='fDeal'){termOpts();updD()}if(s=='calcS')updC();scrollTo(0,0)}
const act=()=>S.deals.filter(d=>d.status=='active'),dealOf=(k,id)=>act().find(d=>d[k]==id);
function info(d){const sc=C.sched(d),t=C.today(),un=sc.filter(x=>!d.paid[x.k]),od=un.filter(y=>y.due<t);return{sc,un,x:un[0],od,pen:od.reduce((a,y)=>a+C.penalty(y.amt,C.diff(t,y.due),d.pen),0),done:!un.length}}
const per=(d,x)=>x.k==1?`${fmt(d.start)} – ${fmt(C.add(d.start,6))}`:`${fmt(C.add(x.due,1))} – ${fmt(C.add(x.due,7))}`;
const cls=d=>{if(!d)return'';const I=info(d);return I.od.length?'r':I.done?'g':'b'};
const tag=d=>!d?'':{r:'просрочка',g:'выплачен',b:'в выкупе'}[cls(d)];
function home(){const A=act().map(d=>({d,...info(d)})),t=C.today(),free=S.bikes.filter(b=>!b.archived&&!dealOf('bike',b.id)).length;
const od=A.filter(a=>a.od.length).sort((a,b)=>a.od[0].due<b.od[0].due?-1:1),ok=A.filter(a=>!a.od.length&&a.x).sort((a,b)=>a.x.due<b.x.due?-1:1).slice(0,10),dn=A.filter(a=>a.done);
const row=(a,c,ch,sub)=>`<div class="card ${c}" onclick="go('deal','${a.d.id}')"><span class=chip>${ch}</span><b>${esc(nm(a.d.client))}</b><div class=mu>${sub}</div></div>`;
return `<div class=top><h2>Главная</h2><button class=s onclick="go('calcS')">Калькулятор</button></div><div class=stats><div><span class=mu>Под выкупом</span><b>${A.length}</b></div><div><span class=mu>Свободно</span><b>${free}</b></div></div>`+
(od.length?`<div class="sec r">Просрочены, идёт неустойка</div>`+od.map(a=>row(a,'r',`${C.diff(t,a.od[0].due)} дн.`,`неустойка ${m(a.pen)} · к оплате ${m(a.x.amt)}`)).join(''):'')+
`<div class=sec>Ближайшие платежи</div>`+(ok.map(a=>{const n=C.diff(a.x.due,t);return row(a,n<=0?'r':n<=2?'y':'g',n==0?'сегодня':`через ${n} дн.`,`оплачено до ${fmt(a.x.due)} · ${m(a.x.amt)}`)}).join('')||'<p class="p mu">Нет платежей</p>')+
(dn.length?`<div class=sec>Выплачены, переведите в архив</div>`+dn.map(a=>row(a,'g','выплачен',esc(bk(a.d.bike)))).join(''):'')}
function base(){const cl=S.clients.filter(c=>!c.archived).sort(newest),bl=S.bikes.filter(b=>!b.archived).sort(newest);let l;
if(tab=='clients')l=cl.map(c=>{const d=dealOf('client',c.id);return `<div class="card ${cls(d)}" onclick="${d?`go('deal','${d.id}')`:`go('fClient','${c.id}')`}"><span class=chip>${d?tag(d):'без выкупа'}</span><b>${esc(c.name)}</b><div class=mu>${esc(c.phone||'')} ${esc(c.tg||'')}</div></div>`}).join('');
else if(tab=='bikes')l=bl.map(b=>{const d=dealOf('bike',b.id);return `<div class="card ${cls(d)}" onclick="${d?`go('deal','${d.id}')`:`go('fBike','${b.id}')`}"><span class=chip>${d?tag(d):'свободен'}</span><b>${esc(b.name)}</b><div class=mu>${esc(b.vin||'')} · закупка ${m(b.cost)}</div></div>`}).join('');
else l=S.deals.filter(d=>d.status!='active').sort(newest).map(d=>`<div class=card onclick="go('deal','${d.id}')"><span class=chip>${{archived:'выкуплен',seized:'изъят'}[d.status]}</span><b>${esc(nm(d.client))}</b><div class=mu>${esc(bk(d.bike))}</div></div>`).join('')+S.bikes.filter(b=>b.archived&&!S.deals.some(d=>d.bike==b.id)).map(b=>`<div class=card><span class=chip>в архиве</span><b>${esc(b.name)}</b></div>`).join('');
return `<div class=top><h2>База</h2></div><div class=tabs>${[['clients','Клиенты'],['bikes','Велосипеды'],['arch','Архив']].map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}</div>`+(l||'<p class="p mu">Пока пусто</p>')}
const add=()=>`<div class=top><h2>Добавить</h2></div><div class=p><button onclick="go('fClient')">Клиента</button><button onclick="go('fBike')">Велосипед</button><button onclick="go('fDeal')">Выкуп</button></div>`;
function fClient(id){const c=S.clients.find(x=>x.id==id)||{};return `<div class=p><h3>Клиент</h3><label>ФИО</label><input id=n value="${esc(c.name)}"><label>Основной телефон</label><input id=p1 type=tel value="${esc(c.phone)}"><label>Telegram (@ник, по желанию)</label><input id=tg value="${esc(c.tg)}"><label>Другие телефоны (номер и подпись, по одному на строке)</label><textarea id=ph rows=3>${esc(c.phones)}</textarea><label>Комментарий</label><input id=cm value="${esc(c.comment)}"><button onclick="saveC('${c.id||''}')">Сохранить</button><button class=g onclick=back()>Отмена</button>${c.id?invBtns(c.id)+`<button class=x onclick="arc('client','${c.id}')">В архив</button><p class=mu>Добавлен: ${c.created?fmt(c.created.slice(0,10)):'—'}</p>`:''}</div>`}
async function saveC(id){if(!v('#n').trim()||!v('#p1').trim())return alert('Введите ФИО и основной телефон');const o=S.clients.find(x=>x.id==id)||{};await put('client',{...o,id:id||undefined,name:v('#n').trim(),phone:v('#p1').trim(),tg:v('#tg').trim(),phones:v('#ph'),comment:v('#cm')});nav('base')}
async function arc(k,id){if(!confirm('Перевести в архив?'+(k=='bike'?' Фото будут удалены безвозвратно.':'')))return;const o=S[k+'s'].find(x=>x.id==id);o.archived=true;if(k=='bike')o.photos=[];await put(k,o);nav('base')}
const img=f=>new Promise(r=>{const i=new Image;i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)});
const thumbs=()=>ph.map((s,i)=>`<span class=th><img src="${s}"><i onclick="ph.splice(${i},1);$('#th').innerHTML=thumbs()">✕</i></span>`).join('');
async function addPh(el){for(const f of [...el.files].slice(0,4-ph.length))ph.push(await img(f));el.value='';$('#th').innerHTML=thumbs()}
function fBike(id){const b=S.bikes.find(x=>x.id==id)||{};return `<div class=p><h3>Велосипед</h3><label>Название</label><input id=n value="${esc(b.name)}"><label>VIN</label><input id=vin value="${esc(b.vin)}"><label>Стоимость закупки, ₽</label><input id=co type=number value="${esc(b.cost)}"><label>SIM-карта трекера</label><input id=sim value="${esc(b.sim)}"><label>Комментарий</label><textarea id=cm rows=3>${esc(b.comment)}</textarea><label>Фото (до 4, удаляются навсегда при переводе в архив)</label><input type=file accept="image/*" multiple onchange="addPh(this)"><div id=th>${thumbs()}</div><br><button onclick="saveB('${b.id||''}')">Сохранить</button><button class=g onclick=back()>Отмена</button>${b.id?`<button class=x onclick="arc('bike','${b.id}')">В архив</button>`:''}</div>`}
async function saveB(id){if(!v('#n').trim()||!(+v('#co')>0))return alert('Введите название и закупку');const o=S.bikes.find(x=>x.id==id)||{};await put('bike',{...o,id:id||undefined,name:v('#n').trim(),vin:v('#vin'),cost:+v('#co'),sim:v('#sim'),comment:v('#cm'),photos:ph});tab='bikes';nav('base')}
const dsTxt=()=>(S.cfg.ds||[[30000,2],[50000,4]]).map(x=>x[0].toLocaleString('ru')+' → '+x[1]).join(', ');
function fDeal(){return `<div class=p><h3>Новый выкуп</h3><label>Клиент</label><select id=c>${S.clients.filter(c=>!c.archived&&!dealOf('client',c.id)).map(c=>`<option value=${c.id}>${esc(c.name)}`).join('')}</select><label>Велосипед</label><select id=b onchange=updD()>${S.bikes.filter(b=>!b.archived&&!dealOf('bike',b.id)).map(b=>`<option value=${b.id}>${esc(b.name)}`).join('')}</select><input id=t type=hidden value=w><label>Срок</label><select id=n onchange=updD()></select><label>Первоначальный взнос, ₽</label><input id=dn type=number oninput=updD()><label>Скидка, п.п. (пусто = авто: ${dsTxt()})</label><input id=ds type=number oninput=updD()><label>Номер договора</label><input id=ct><label>Дата оформления (первый день)</label><input id=s type=date value="${C.today()}"><label>Второй аккумулятор: закупка, ₽ (если берёт)</label><input id=ec type=number oninput=updD()><label>Способ оплаты первого периода</label><select id=m><option>наличные<option>СБП<option>перевод</select><div id=pv class=pv></div><button onclick=saveDeal()>Создать выкуп</button><button class=g onclick=back()>Отмена</button></div>`}
function termOpts(){const mk=S.cfg.mk||C.MK;$('#n').innerHTML=Object.keys(mk.w).map(n=>`<option value=${n}>${n} нед. (+${mk.w[n]}%)`).join('')}
function dealIn(){const b=S.bikes.find(x=>x.id==v('#b'));if(!b||!v('#c'))return;const ec=+v('#ec');return{cost:b.cost,type:'w',n:+v('#n'),down:+v('#dn')||0,disc:v('#ds'),mk:S.cfg.mk,tax:S.cfg.tax,ds:S.cfg.ds,extras:ec?[{name:'Второй аккумулятор',cost:ec,price:Math.round(ec*(1+(S.cfg.exm==null?24:S.cfg.exm)/100))}]:[]}}
const res=r=>`Цена ${m(r.total)} · остаток ${m(r.bal)}<br>Платёж <b>${m(r.pay)}</b> · последний ${m(r.last)}<br><span class=mu>Налог ${S.cfg.tax==null?7:S.cfg.tax}%: ${m(r.tax)} · прибыль ${m(r.profit)} (${r.pct.toFixed(0)}%)</span>${r.pct<25?'<br><b style=color:var(--er)>⚠ прибыль ниже 25%</b>':''}`;
function updD(){const o=dealIn();$('#pv').innerHTML=o?res(C.calc(o)):'Нет свободных клиентов или велосипедов'}
async function saveDeal(){const o=dealIn();if(!o)return alert('Нужны клиент и велосипед');const r=C.calc(o);
await put('deal',{client:v('#c'),bike:v('#b'),type:'w',n:o.n,start:v('#s'),down:o.down,disc:r.d,mk:r.mk,cost:o.cost,pay:r.pay,last:r.last,total:r.total,tax:r.tax,extras:o.extras,contract:v('#ct'),pen:S.cfg.pen==null?0.9:S.cfg.pen,early:[],status:'active',paid:{1:{date:v('#s'),amt:o.n==1?r.last:r.pay,pen:0,method:v('#m')}}});nav('home')}
function deal(id){const d=S.deals.find(x=>x.id==id),c=S.clients.find(x=>x.id==d.client)||{},I=info(d),on=d.status=='active',k=I.sc.length-I.un.length;
const r=x=>{const p=d.paid[x.k];return `<div class="card ${p?'g':x.due<C.today()?'r':''}"><b>${x.k}. ${per(d,x)}</b> · ${m(p?p.amt:x.amt)}<div class=mu>${p?`✓ ${fmt(p.date)}, ${p.method}${p.pen?', неустойка '+m(p.pen):''} ${on?`<a href="#" onclick="unpay('${d.id}',${x.k});return false">отменить</a>`:''}`:'до '+fmt(x.due)}</div></div>`};
return `<div class=p><button class="g s" onclick=back()>← Назад</button><h2 style="margin-top:14px">${esc(c.name)}</h2><div style="font-size:20px">${esc(c.phone)}</div><div class=mu>${esc(bk(d.bike))} · договор ${esc(d.contract||'—')} от ${fmt(d.start)}${c.phones?'<br>'+esc(c.phones).replace(/\n/g,'<br>'):''}</div>
<div style="margin-top:10px"><a class=btn href="tel:${esc(c.phone)}">Позвонить</a>${c.tg?`<a class="btn g" href="https://t.me/${esc(c.tg.replace('@',''))}">Написать</a>`:''}</div>
<div class=big2 style="margin-top:14px">${k} из ${I.sc.length}</div><div class=bar><i style="width:${k/I.sc.length*100}%"></i></div>${I.od.length?`<div class=pv style="background:#F5D6D0">Просрочка. Неустойка сейчас: ${m(I.pen)}</div>`:''}
${on&&I.x?`<button class=big onclick="go('payS','${d.id}')">Принять оплату</button><button class=g onclick="early('${d.id}')">Досрочно ${m(EA())}</button><button class=g onclick="defer('${d.id}')">Отсрочка ${S.cfg.dd||2} дн.</button>`:''}</div>
<div class=sec>${allSch?'Весь график':'Ближайшие платежи'}</div>${(allSch?I.sc:I.un.slice(0,3)).map(r).join('')||'<p class="p mu">Все периоды оплачены</p>'}
<div class=p><button class=g onclick="allSch=!allSch;render()">${allSch?'Скрыть график':'Показать весь график'}</button><button class=g onclick="go('fClient','${c.id}')">Изменить клиента</button>${invBtns(c.id)}${on?`${I.done?`<button onclick="fin('${d.id}','archived')">В архив выкупленных</button>`:''}<button class=x onclick="fin('${d.id}','seized')">Изъять</button>`:''}<p class=mu>Клиент добавлен: ${c.created?fmt(c.created.slice(0,10)):'—'}</p></div>`}
function payS(id){const d=S.deals.find(x=>x.id==id),x=info(d).x;return `<div class=p><button class="g s" onclick=back()>← Назад</button><h3>Принять оплату</h3><div class=mu>Период ${x.k} из ${info(d).sc.length}: ${per(d,x)}</div><div class=big2 id=am>${m(x.amt)}</div><label>Дата получения</label><input id=pd type=date value="${C.today()}"><label>Способ</label><select id=pm><option>наличные<option>СБП<option>перевод</select><button class=big onclick="confirmPay('${id}')">Подтвердить</button></div>`}
async function confirmPay(id){const d=S.deals.find(x=>x.id==id),x=info(d).x,dt=v('#pd'),pen=C.penalty(x.amt,Math.max(0,C.diff(dt,x.due)),d.pen);if(!confirm(`Принять ${m(x.amt+pen)}${pen?` (неустойка ${m(pen)})`:''}?`))return;d.paid[x.k]={date:dt,amt:x.amt,pen,method:v('#pm')};await put('deal',d);back()}
async function unpay(id,k){if(!confirm('Отменить платёж?'))return;const d=S.deals.find(x=>x.id==id);delete d.paid[k];await put('deal',d)}
async function defer(id){const d=S.deals.find(x=>x.id==id),n=S.cfg.dd||2;if(!confirm(`Отсрочка ${n} дн.: все ещё не оплаченные платежи сдвинутся на ${n} дн., неустойка в эти дни не начисляется. Применить?`))return;d.shift=(d.shift||0)+n;(d.defer=d.defer||[]).push({date:C.today(),days:n,by:'admin'});await put('deal',d)}
async function early(id){const d=S.deals.find(x=>x.id==id),a=EA(),I=info(d);const eff=Math.round(a*(1+(S.cfg.ed==null?1:S.cfg.ed)/100));if(eff>I.un.reduce((s,x)=>s+x.amt,0))return alert('Сумма больше остатка');const mt=prompt('Способ: 1 наличные, 2 СБП, 3 перевод','1');if(!mt)return;if(!confirm(`Принять досрочно ${m(a)}? Зачтётся ${m(eff)}, периоды сократятся с конца.`))return;(d.early=d.early||[]).push({date:C.today(),paid:a,amt:eff,method:MT[mt]||'наличные'});await put('deal',d)}
async function fin(id,st){let d=S.deals.find(x=>x.id==id);if(st=='seized'){if(!confirm('Изъять велосипед? Выкуп будет закрыт.'))return;d.refund=+prompt('Возвращено клиенту, ₽','0')||0}
else{if(!confirm('Перевести клиента и велосипед в архив выкупленных? Фото будут удалены безвозвратно.'))return;const b=S.bikes.find(x=>x.id==d.bike);b.archived=true;b.photos=[];await put('bike',b);const c=S.clients.find(x=>x.id==d.client);c.archived=true;await put('client',c);d=S.deals.find(x=>x.id==id)}
d.status=st;await put('deal',d);nav('home')}
const calcS=()=>`<div class=p><button class="g s" onclick=back()>← Назад</button><h3 style="margin-top:14px">Калькулятор</h3><label>Закупка велосипеда, ₽</label><input id=k type=number oninput=updC()><label>Первоначальный взнос, ₽</label><input id=d2 type=number oninput=updC()></div><div id=tb></div>`;
function updC(){const cost=+v('#k'),mk=S.cfg.mk||C.MK;$('#tb').innerHTML=!cost?'':Object.keys(mk.w).map(n=>{const r=C.calc({cost,type:'w',n:+n,down:+v('#d2')||0,mk:S.cfg.mk,tax:S.cfg.tax,ds:S.cfg.ds});return `<div class="card ${r.pct<25?'r':''}"><b>${n} недель</b> · платёж ${m(r.pay)}<div class=mu>последний ${m(r.last)} · цена ${m(r.total)} · налог ${m(r.tax)}<br>прибыль ${m(r.profit)} (${r.pct.toFixed(0)}%)${r.pct<25?' ⚠':''}</div></div>`}).join('')}
const rep=()=>'<div class=top><h2>Отчёты</h2></div><p class="p mu">Отчёты и аналитика появятся в следующей части.</p>';
function set(){const mk=S.cfg.mk||C.MK,ds=S.cfg.ds||[[30000,2],[50000,4]],tx=S.cfg.tax==null?7:S.cfg.tax,pn=S.cfg.pen==null?0.9:S.cfg.pen;return `<div class=top><h2>Настройки</h2></div><div class=p><h3>Наценка по срокам (недели), %</h3>${Object.keys(mk.w).map(n=>`<label>${n} недель</label><input type=number data-n=${n} value=${mk.w[n]}>`).join('')}<h3>Дополнительный аккумулятор</h3><label>Наценка на закупку, %</label><input id=exm type=number value=${S.cfg.exm==null?24:S.cfg.exm}><h3>Налог и неустойка</h3><label>Налог с выручки, %</label><input id=tax type=number step=any value=${tx}><label>Неустойка, % от платежа за каждый день просрочки</label><input id=pen type=number step=any value=${pn}><h3>Скидка за первоначальный взнос</h3><label>Взнос 1, ₽</label><input id=da0 type=number value=${ds[0][0]}><label>Скидка 1, п.п. к наценке</label><input id=db0 type=number step=any value=${ds[0][1]}><label>Взнос 2, ₽</label><input id=da1 type=number value=${ds[1][0]}><label>Скидка 2, п.п. к наценке</label><input id=db1 type=number step=any value=${ds[1][1]}><h3>Досрочный платёж</h3><label>Фиксированная сумма, ₽</label><input id=ea type=number value=${EA()}><label>Бонус за досрочный платёж, %</label><input id=ed type=number step=any value=${S.cfg.ed==null?1:S.cfg.ed}><h3>Отсрочка</h3><label>Срок отсрочки, дней</label><input id=dd type=number value=${S.cfg.dd||2}><p class=mu>Новые значения действуют для новых выкупов.</p><button onclick=saveSet()>Сохранить</button></div>`}
async function saveSet(){const mk={w:{},m:(S.cfg.mk||C.MK).m};document.querySelectorAll('[data-n]').forEach(i=>mk.w[i.dataset.n]=+i.value);await put('cfg',{id:'cfg',mk,exm:+v('#exm'),tax:+v('#tax'),pen:+v('#pen'),early:+v('#ea'),ed:+v('#ed'),dd:+v('#dd'),ds:[[+v('#da0'),+v('#db0')],[+v('#da1'),+v('#db1')]]});alert('Сохранено')}

let ME,CV=['main'];
const cgo=s=>{CV.push(s);crender()},cback=()=>{CV.pop();crender()};
function ask(text,yes){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;padding:20px;z-index:9';o.innerHTML=`<div class=card style="margin:0;width:100%"><h3 style="margin-top:0">Отсрочка</h3><p>${text}</p><button id=ay>Да</button><button class=g id=an>Отменить</button></div>`;document.body.appendChild(o);$('#an').onclick=()=>o.remove();$('#ay').onclick=()=>{o.remove();yes()}}
function defAsk(id){ask(`Отсрочка на ${ME.dd} дн.: ближайший платёж и все следующие сдвинутся на ${ME.dd} дн., неустойка в эти дни начисляться не будет. Отсрочку можно использовать только один раз за весь срок выкупа. Применить?`,async()=>{try{await api('/api/defer',{id});ME=await api('/api/me');crender()}catch(e){alert('Отсрочка недоступна: возможно, она уже использована или есть просрочка.')}})}
async function claim(tok){try{await api('/api/claim',{tok,phone:v('#ph')});location.reload()}catch(e){alert('Не удалось войти. Проверьте номер телефона и ссылку.')}}
function clientUI(){document.querySelector('nav').style.display='none';
if(ME.role=='new'){const tok=(T.initDataUnsafe||{}).start_param;$('#app').innerHTML=tok?`<div class=p><h2>Вход</h2><p class=mu>Введите номер телефона, который вы сообщили владельцу.</p><input id=ph type=tel placeholder="+7 ..."><button class=big onclick="claim('${esc(tok)}')">Войти</button></div>`:'<p class=p>Откройте ссылку, которую прислал владелец.</p>';return}
crender()}
function crender(){const d=ME.deals.find(x=>x.status=='active')||ME.deals[0];if(!d){$('#app').innerHTML='<p class=p>Выкупов пока нет.</p>';return}$('#app').innerHTML=({main:cmain,sch:csch,hist:chist})[CV[CV.length-1]](d);scrollTo(0,0)}
function cmain(d){const I=info(d),t=C.today(),x=I.x,k=I.sc.length-I.un.length;let cl='g',tx='Период оплачен, всё хорошо';
if(I.done)tx='Всё оплачено. Поздравляем!';else{const n=C.diff(x.due,t);if(n<0){cl='dr';tx=`Просрочка ${-n} дн. Неустойка ${m(I.pen)}`}else if(n==0){cl='r';tx='Сегодня оплата'}else if(n<=2){cl='y';tx=n==1?'Завтра оплата':'Оплата через 2 дня'}}
const can=d.status=='active'&&!I.done&&!(d.defer||[]).some(z=>z.by=='client')&&!I.od.length;
return `<div class="st ${cl}">${tx}</div><div class=p><div class=big2>${k} из ${I.sc.length}</div><div class=bar><i style="width:${k/I.sc.length*100}%"></i></div>${x?`<div class=card style="margin:14px 0"><div class=mu>Следующий платёж</div><div class=big2>${m(x.amt)}</div><div>до ${fmt(x.due)}</div><div class=mu>Период ${x.k} из ${I.sc.length}: ${per(d,x)}</div></div>`:''}<button class="big g" onclick="cgo('sch')">График платежей</button><button class="big g" onclick="cgo('hist')">История оплат</button>${can?`<button class="big g" onclick="defAsk('${d.id}')">Отсрочка</button>`:''}</div>`}
const csch=d=>`<div class=p><button class="g s" onclick=cback()>← Назад</button><h3>График платежей</h3></div>`+info(d).sc.map(x=>{const p=d.paid[x.k];return `<div class="card ${p?'g':x.due<C.today()?'r':''}"><b>${x.k}. ${per(d,x)}</b> · ${m(p?p.amt:x.amt)}<div class=mu>${p?'✓ оплачен '+fmt(p.date):'до '+fmt(x.due)}</div></div>`}).join('');
const chist=d=>`<div class=p><button class="g s" onclick=cback()>← Назад</button><h3>История оплат</h3></div>`+(Object.entries(d.paid).map(([k,p])=>`<div class=card><b>${m(p.amt+(p.pen||0))}</b> · ${fmt(p.date)}<div class=mu>период ${k}, ${p.method}${p.pen?', неустойка '+m(p.pen):''}</div></div>`).join('')+(d.early||[]).map(e=>`<div class=card><b>${m(e.paid||e.amt)}</b> · ${fmt(e.date)}<div class=mu>досрочный платёж, ${e.method}</div></div>`).join('')||'<p class="p mu">Платежей пока нет</p>');
const invBtns=cid=>`<button class=g onclick="invite('${cid}')">Ссылка для клиента</button><button class=g onclick="unbind('${cid}')">Сбросить доступ</button>`;
async function invite(cid){try{const r=await api('/api/invite',{client:cid}),link=`https://t.me/${r.bot}?startapp=${r.tok}`;T.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('Ссылка для входа в приложение'))}catch(e){alert('Не удалось создать ссылку')}}
async function unbind(cid){if(confirm('Сбросить доступ клиента? Ему понадобится новая ссылка.')){await api('/api/unbind',{client:cid});alert('Доступ сброшен')}}
async function boot(){try{ME=await api('/api/me');if(ME.role=='owner')load();else clientUI()}catch(e){$('#app').innerHTML='<p class=p>Доступ запрещён или нет связи. Откройте приложение из Telegram.</p>'}}
boot();
</script></body></html>
