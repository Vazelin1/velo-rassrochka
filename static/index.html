<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/calc.js"></script>
<style>:root{--bg:#fff;--tx:#111;--cd:#f1f3f5}@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--tx:#eee;--cd:#2c2c2e}}
body{margin:0;font:15px sans-serif;background:var(--bg);color:var(--tx);padding-bottom:72px}.p{padding:10px}
.card{background:var(--cd);margin:6px 10px;padding:10px;border-radius:10px;border-left:6px solid #2e7d32}.y{border-color:#f9a825}.r{border-color:#c62828}
button{padding:9px 13px;border:0;border-radius:8px;background:#1565c0;color:#fff;font-size:15px;margin:3px 3px 0 0}button.g{background:#607d8b}button.x{background:#c62828}
input,select{width:100%;box-sizing:border-box;padding:9px;margin:4px 0;font-size:16px}.top{display:flex;justify-content:space-between;align-items:center;padding:6px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd)}nav button{flex:1;border-radius:0;margin:0;background:none;color:var(--tx);padding:16px 0}</style></head><body>
<div id="app"></div><nav><button onclick="nav('home')">Главная</button><button onclick="nav('base')">База</button><button onclick="nav('add')"><b>＋</b></button><button onclick="nav('rep')">Отчёты</button><button onclick="nav('set')">Настройки</button></nav>
<script>
const T=Telegram.WebApp;T.ready();T.expand();
let S={clients:[],bikes:[],deals:[],cfg:{}},V=[['home']],tab='clients';
const $=s=>document.querySelector(s),v=s=>$(s).value,m=n=>Math.round(n).toLocaleString('ru')+' ₽',fmt=d=>d.split('-').reverse().join('.');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>(S.clients.find(c=>c.id==id)||{}).name||'?',bk=id=>(S.bikes.find(c=>c.id==id)||{}).name||'?';
const api=async(p,b)=>{const r=await fetch(p,{method:b?'POST':'GET',headers:{'X-Init':T.initData,'Content-Type':'application/json'},body:b&&JSON.stringify(b)});if(!r.ok)throw 0;return r.json()};
async function load(){try{const a=await api('/api/all');S={clients:[],bikes:[],deals:[],cfg:{}};a.forEach(d=>{if(d.kind=='cfg')S.cfg=d.data;else S[d.kind+'s'].push({...d.data,id:d.id})});render()}catch(e){$('#app').innerHTML='<p class=p>Доступ запрещён или нет связи. Откройте приложение из Telegram-бота.</p>'}}
async function put(kind,o){o.id=o.id||Math.random().toString(36).slice(2,10);await api('/api/put',{kind,id:o.id,data:o});await load()}
const nav=s=>{V=[[s]];render()},go=(s,a)=>{V.push([s,a]);render()},back=()=>{if(V.length>1)V.pop();render()};
function render(){const[s,a]=V[V.length-1];$('#app').innerHTML=({home,base,add,fClient,fBike,fDeal,deal,calcS,rep,set})[s](a);if(s=='fDeal'){termOpts();updD()}if(s=='calcS')updC()}
function home(){const act=S.deals.filter(d=>d.status=='active'),t=C.today();
const rows=act.map(d=>({d,x:C.sched(d).find(x=>!d.paid[x.k])})).filter(r=>r.x).sort((a,b)=>a.x.due<b.x.due?-1:1).slice(0,10);
return `<div class=top><h2>${act.length} под выкупом</h2><button onclick="go('calcS')">Калькулятор</button></div>`+rows.map(({d,x})=>{const n=C.diff(x.due,t);return `<div class="card ${n<=0?'r':n<=2?'y':''}" onclick="go('deal','${d.id}')"><b>${esc(nm(d.client))}</b><br>оплачено до ${fmt(x.due)} · ${m(x.amt)}${n<0?` · просрочка ${-n} дн.`:''}</div>`}).join('')||'<p class=p>Ближайших платежей нет</p>'}
function base(){const l=tab=='clients'?S.clients.map(c=>`<div class=card onclick="go('fClient','${c.id}')">${esc(c.name)}</div>`):tab=='bikes'?S.bikes.map(b=>`<div class=card onclick="go('fBike','${b.id}')">${esc(b.name)} · ${esc(b.vin)}</div>`):S.deals.filter(d=>d.status!='active').map(d=>`<div class=card onclick="go('deal','${d.id}')">${esc(nm(d.client))} · ${esc(bk(d.bike))} · ${{archived:'выкуплен',seized:'изъят'}[d.status]}</div>`);
return `<div class=p>${[['clients','Клиенты'],['bikes','Велосипеды'],['arch','Архив']].map(([k,n])=>`<button class="${tab==k?'':'g'}" onclick="tab='${k}';render()">${n}</button>`).join('')}</div>`+l.join('')}
const add=()=>`<div class=p><h3>Добавить</h3><button onclick="go('fClient')">Клиента</button><button onclick="go('fBike')">Велосипед</button><button onclick="go('fDeal')">Выкуп</button></div>`;
function fClient(id){const c=S.clients.find(x=>x.id==id)||{};return `<div class=p><h3>Клиент</h3><input id=n placeholder="ФИО" value="${esc(c.name)}"><textarea id=ph rows=4 style="width:100%" placeholder="Телефоны, по одному на строке: номер и подпись (например: +7900... мама)">${esc(c.phones)}</textarea><input id=cm placeholder="Комментарий" value="${esc(c.comment)}"><button onclick="saveC('${c.id||''}')">Сохранить</button><button class=g onclick=back()>Отмена</button></div>`}
async function saveC(id){if(!v('#n').trim())return alert('Введите ФИО');await put('client',{id:id||undefined,name:v('#n').trim(),phones:v('#ph'),comment:v('#cm')});nav('base')}
function fBike(id){const b=S.bikes.find(x=>x.id==id)||{};return `<div class=p><h3>Велосипед</h3><input id=n placeholder="Название" value="${esc(b.name)}"><input id=vin placeholder="VIN" value="${esc(b.vin)}"><input id=co type=number placeholder="Стоимость закупки" value="${esc(b.cost)}"><input id=sim placeholder="SIM-карта трекера" value="${esc(b.sim)}"><button onclick="saveB('${b.id||''}')">Сохранить</button><button class=g onclick=back()>Отмена</button></div>`}
async function saveB(id){if(!v('#n').trim()||!(+v('#co')>0))return alert('Введите название и закупку');await put('bike',{id:id||undefined,name:v('#n').trim(),vin:v('#vin'),cost:+v('#co'),sim:v('#sim')});tab='bikes';nav('base')}
function fDeal(){return `<div class=p><h3>Новый выкуп</h3><select id=c>${S.clients.map(c=>`<option value=${c.id}>${esc(c.name)}`).join('')}</select><select id=b onchange=updD()>${S.bikes.filter(b=>!S.deals.some(d=>d.bike==b.id&&d.status=='active')).map(b=>`<option value=${b.id}>${esc(b.name)}`).join('')}</select><select id=t onchange="termOpts();updD()"><option value=w>Еженедельно (7 дней)<option value=m>Ежемесячно (30 дней)</select><select id=n onchange=updD()></select><input id=dn type=number placeholder="Первоначальный взнос" oninput=updD()><input id=ds type=number placeholder="Скидка, п.п. (пусто = авто: 30 000 → 2, 50 000 → 4)" oninput=updD()><input id=s type=date value="${C.today()}"><input id=ct placeholder="Номер и дата договора"><input id=ec type=number placeholder="Доп. аккумулятор: закупка (пусто = нет)" oninput=updD()><input id=ep type=number placeholder="Доп. аккумулятор: цена (пусто = +24%)" oninput=updD()>Способ оплаты первого периода<select id=m><option>наличные<option>СБП<option>перевод</select><div id=pv class=card></div><button onclick=saveDeal()>Создать выкуп</button><button class=g onclick=back()>Отмена</button></div>`}
function termOpts(){const t=v('#t'),mk=S.cfg.mk||C.MK;$('#n').innerHTML=Object.keys(mk[t]).map(n=>`<option value=${n}>${n} ${t=='w'?'нед.':'мес.'} (+${mk[t][n]}%)`).join('')}
function dealIn(){const b=S.bikes.find(x=>x.id==v('#b'));if(!b||!v('#c'))return;const ec=+v('#ec'),ep=+v('#ep')||Math.round(ec*1.24);return{cost:b.cost,type:v('#t'),n:+v('#n'),down:+v('#dn')||0,disc:v('#ds'),mk:S.cfg.mk,extras:ec?[{name:'Доп. аккумулятор',cost:ec,price:ep}]:[]}}
const res=r=>`Цена ${m(r.total)} · остаток ${m(r.bal)}<br>Платёж <b>${m(r.pay)}</b> · последний ${m(r.last)}<br>Налог 7%: ${m(r.tax)} · прибыль ${m(r.profit)} (${r.pct.toFixed(0)}%)${r.pct<25?' <b style=color:#c62828>⚠ ниже 25%</b>':''}`;
function updD(){const o=dealIn();$('#pv').innerHTML=o?res(C.calc(o)):'Сначала добавьте клиента и велосипед'}
async function saveDeal(){const o=dealIn();if(!o)return alert('Нужны клиент и велосипед');const r=C.calc(o);
await put('deal',{client:v('#c'),bike:v('#b'),type:o.type,n:o.n,start:v('#s'),down:o.down,disc:r.d,mk:r.mk,cost:o.cost,pay:r.pay,last:r.last,total:r.total,tax:r.tax,extras:o.extras,contract:v('#ct'),status:'active',paid:{1:{date:v('#s'),amt:o.n==1?r.last:r.pay,pen:0,method:v('#m')}}});nav('home')}
function deal(id){const d=S.deals.find(x=>x.id==id),t=C.today(),sc=C.sched(d),all=sc.every(x=>d.paid[x.k]),c=S.clients.find(x=>x.id==d.client)||{};
return `<div class=p><button class=g onclick=back()>←</button><h3>${esc(nm(d.client))}</h3>${esc(bk(d.bike))} · договор: ${esc(d.contract||'—')}<br>${esc(c.phones).replace(/\n/g,'<br>')}<br>Цена ${m(d.total)} · налог ${m(d.tax)}${d.status!='active'?'<br><b>'+({archived:'Выкуплен (архив)',seized:'Изъят'}[d.status])+'</b>':''}</div>`+sc.map(x=>{const p=d.paid[x.k];return `<div class=card>${x.k}. ${fmt(x.due)} — ${m(x.amt)} ${p?`✓ ${fmt(p.date)}, ${p.method}${p.pen?', неустойка '+p.pen:''}`:(d.status=='active'?`<button onclick="pay('${d.id}',${x.k})">Оплачен</button>`:'')+(x.due<t?' <b style=color:#c62828>просрочка</b>':'')}</div>`}).join('')+(d.status=='active'?`<div class=p>${all?`<button onclick="fin('${d.id}','archived')">В архив выкупленных</button>`:''}<button class=x onclick="fin('${d.id}','seized')">Изъять</button></div>`:'')}
async function pay(id,k){const d=S.deals.find(x=>x.id==id),x=C.sched(d)[k-1],dt=prompt('Дата получения (ГГГГ-ММ-ДД)',C.today());if(!dt)return;const mt=prompt('Способ: 1 наличные, 2 СБП, 3 перевод','1');if(!mt)return;
const pen=C.penalty(x.amt,Math.max(0,C.diff(dt,x.due)));if(!confirm(`Принято ${m(x.amt+pen)} (неустойка ${m(pen)})?`))return;d.paid[k]={date:dt,amt:x.amt,pen,method:['','наличные','СБП','перевод'][mt]||'наличные'};await put('deal',d)}
async function fin(id,st){const d=S.deals.find(x=>x.id==id);if(st=='seized'){if(!confirm('Изъять велосипед? Выкуп будет закрыт.'))return;d.refund=+prompt('Возвращено клиенту, ₽','0')||0}d.status=st;await put('deal',d);nav('home')}
const calcS=()=>`<div class=p><button class=g onclick=back()>←</button><h3>Калькулятор</h3><input id=k type=number placeholder="Закупка велосипеда" oninput=updC()><select id=t2 onchange=updC()><option value=w>Недели<option value=m>Месяцы</select><input id=d2 type=number placeholder="Первоначальный взнос" oninput=updC()></div><div id=tb></div>`;
function updC(){const cost=+v('#k'),t=v('#t2'),mk=S.cfg.mk||C.MK;$('#tb').innerHTML=!cost?'':Object.keys(mk[t]).map(n=>{const r=C.calc({cost,type:t,n:+n,down:+v('#d2')||0,mk:S.cfg.mk});return `<div class=card><b>${n} ${t=='w'?'нед.':'мес.'}</b>: платёж ${m(r.pay)} (последний ${m(r.last)})<br>цена ${m(r.total)} · налог ${m(r.tax)}<br>прибыль ${m(r.profit)} (${r.pct.toFixed(0)}%)${r.pct<25?' ⚠':''}</div>`}).join('')}
const rep=()=>'<p class=p>Отчёты и аналитика появятся в следующей части.</p>';
function set(){const mk=S.cfg.mk||C.MK;return `<div class=p><h3>Наценки, %</h3>${['w','m'].map(t=>Object.keys(mk[t]).map(n=>`${n} ${t=='w'?'нед.':'мес.'} <input type=number style="width:80px" data-t=${t} data-n=${n} value=${mk[t][n]}>`).join('<br>')).join('<hr>')}<p>Налог 7%, неустойка 0,9% в день и скидки за взнос пока заданы в коде.</p><button onclick=saveSet()>Сохранить</button></div>`}
async function saveSet(){const mk={w:{},m:{}};document.querySelectorAll('[data-t]').forEach(i=>mk[i.dataset.t][i.dataset.n]=+i.value);await put('cfg',{id:'cfg',mk});alert('Сохранено')}
load();
</script></body></html>
