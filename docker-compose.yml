services:
  app:
    build: .
    restart: always
    env_file: .env
    volumes: ["./data:/data"]
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80","443:443"]
    environment: [DOMAIN]
    env_file: .env
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile","caddy:/data"]
volumes: {caddy: {}}
